[task]
name = "afterquery/pg-wal-rewind"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = """Every dataset was produced by a real PostgreSQL 16.15 server running a synthetic, seeded order workload written for this task; no production data is involved.

This is the job of a database reliability engineer or PostgreSQL consultant doing an audit or a forensic recovery from a WAL archive. They must answer "what did this table contain at time T" for many instants, after VACUUM has removed the old row versions and after two point-in-time restores forked the cluster. Tools that read WAL directly (pg_waldump, logical-decoding forensics, change-data-capture readers) exist because restoring a server per question is too slow. Here none is installed, and the agent builds that reader from the PostgreSQL sources shipped in the environment.

The crux is that the only base backup was taken at the end of the history, on timeline 3, while every question is about an earlier instant. Replaying WAL forward from that backup answers nothing; the past has to be reconstructed. INCIDENT.md states the facts that make it possible: the archive starts at a checkpoint taken while the server was idle, full_page_writes is on, and each promoted server checkpointed before doing any work. From those, the agent has to work out that:
- the first change to any page after the archive's checkpoint, on the final timeline's path, carries a full-page image;
- that image minus that one change is the page as it was when the archive starts, and a page the final path never changes is still the backup's copy;
- every timeline can then be replayed forward from that common starting state.

Two table rewrites break that rule, because the rewritten table's old heap and TOAST files are dropped and so are not in the backup. Old pages that no record touched before the rewrite have no image anywhere; their rows survive only as the rewrite's copies in the new files. The agent has to pair each old file with its replacement through pg_class (same table, new relfilenode at the rewrite's commit, and the TOAST table it points to), subtract the copies of rows it already knows, and treat the rest as the lost pages' contents. The two rewrites copy differently:
- VACUUM FULL orders, early on timeline 1, writes its copies as page images with xmin and TOAST value ids kept, but it may clear a dead xmax, reuse the command-id field and toast a long value differently. Copies match on xmin and the key. The staging check at the archive start falls before it, so the gap is visible.
- ALTER COLUMN TYPE on order_items runs on timeline 3 only. It inserts the visible rows again under its own xid, with unit_price converted from numeric(10,2) to numeric(12,3), and toasts values into a new TOAST table. Copies match only on the key among rows visible at the rewrite; the recovered rows predate the archive, and their unit_price has to be printed at the old column's scale. About a thousand items of closed orders are never touched before it, so on timeline 3 most of order_items' history depends on this. On timelines 1 and 2 those same pages are untouched too, so every timeline's order_items answers depend on rows recovered from a rewrite that only timeline 3 ran. There are no staging answers for order_items: the agent has to reason it out, or notice that the table's rows change across the rewrite's commit.

The obvious shortcuts are wrong in ways that show up in the answers:
- Taking the first image as-is mostly works, because the change's own transaction had not committed yet. But an abandoned timeline reuses transaction ids that timeline 3 also used, so on timeline 2 the leftover change can look committed. This fails two of the five sealed datasets.
- The backup's pg_xact and pg_multixact describe the final timeline only, and they already record transactions that, at the asked instant, had not yet committed. Only transactions older than the archive's checkpoint may be looked up there; everything later must come from each path's own commit records.
- Timeline 3 branches from timeline 1, after the point where timeline 2 branched, so chaining timelines in numeric order replays the wrong WAL. A partition created on timeline 2 exists nowhere but in that timeline's WAL.

The rest is the full reader and needs the details right: block headers (including XLOG_FPI records without main data), pglz and LZ4 page images, heap and heap2 redo, subtransactions, COMMIT PREPARED, multixacts, lock-only xmax, frozen tuples and xid wraparound (four of the five sealed datasets), a catalog read as of the instant (mapped catalogs through pg_filenode.map, enum labels renamed and extended, a domain, partitions attached and detached with columns mapped by name across a table with its own column order and one in another schema, fast defaults in attmissingval), and byte-exact text output. That includes float8 through a port of d2s.c as PostgreSQL builds it, which INCIDENT.md states with a boundary example, and interval in EncodeInterval's postgres style.

The staging dataset has live answers for orders and shipments only, at two instants near the start of the archive, so the restores, the abandoned timelines and order_items have to be gotten right by reasoning. The reference is about 1,490 lines of Python. A PostgreSQL internals expert who knows the approach would need most of a working day; seeing how to recover the past from a backup taken at the end is the hard part."""
solution_explanation = """Read the archive. List the timelines and read each history file to get every timeline's path, as (timeline, first LSN) pairs; a history file lists only the timeline's real ancestors. A timeline is live from its first commit record after its branch point, and timeline 1 before any of those.

Find the starting state. In the first archived segment, find the first checkpoint record; its redo LSN is where replay starts, and its nextXid, nextMulti and nextMultiOffset separate transactions and multixacts that were over before the archive from later ones. Load the final backup's pages. Read the final timeline's path (the backup label's START TIMELINE) from the redo LSN. For each heap page of the database, take the first heap or heap2 record that changes it, ignoring VISIBLE records, which do not touch tuples:
- if it initialises the page, the page did not exist yet;
- otherwise it carries a full-page image: restore the image and undo that record's effect on the page. Remove the tuples an INSERT, MULTI_INSERT or UPDATE put there, and clear the xmax that a DELETE, UPDATE, LOCK or LOCK_UPDATED set. Pruning, vacuuming, freezing and in-place updates change nothing a query can see.

Pages the path never changes keep the backup's content. Pages of relations created after the checkpoint start absent.

Recover the rewritten tables. Replay the final path; at a commit that drops files which existed at the checkpoint (VACUUM FULL orders, ALTER COLUMN TYPE on order_items), read pg_class just before and just after it. Pair the dropped heap file with the table's new relfilenode, and its TOAST file with the new TOAST table's. The new heap's tuples that are not copies of the old file's known tuples are the tuples of the old pages no record touched:
- if the copies carry the rewriting transaction's xid (ALTER TABLE), match them on the leading key column against the old rows visible at the commit, and give the unmatched ones a frozen xmin;
- otherwise (VACUUM FULL), match on xmin and the leading key column.

The new TOAST table's chunks that are not in the old one cover their values. A known row whose TOAST chunks were lost takes that value from its copy. Add the recovered rows to the old file as one extra page. When another timeline later writes an image of a page that had no starting state, the rows on it that predate the archive leave that extra page. Print numeric columns with a declared typmod at its scale; every stored value has it, and it undoes the conversion of the recovered rows. This is the state every timeline starts from.

Replay a timeline's path from there. Skip page headers, join records that span pages, follow XLOG_SWITCH, and decode the block references; the block headers end where the declared data lengths begin. Restore page images after pglz or LZ4 decompression and hole refill. Apply heap and heap2 redo on a per-page model of line pointers and tuple bytes. A relation that is not in the backup (a partition made on an abandoned timeline) starts with its first initialised page or page image. Record commit times from commit and commit-prepared records (taking the prepared xid), including subtransactions, and keep multixact members from CREATE_ID records. Stop just before the first commit later than the instant.

Visibility at that point: a version counts if its xmin is frozen or committed, and its xmax is absent, lock-only, a multixact without a committed updater, or uncommitted. Committed means a commit record already replayed on this path, or, for a transaction older than the archive's checkpoint, the backup's pg_xact. Multixacts work the same way, with pg_multixact for older ones.

Read pg_class (through pg_filenode.map for mapped catalogs), pg_namespace, pg_type, pg_enum, pg_inherits and pg_attribute with the same rule, as of the instant. Find the table in public and expand a partitioned table to its leaf partitions, whatever their schema. Map the parent's columns to each leaf's live attributes by name. Decode tuples through dropped columns, the null bitmap, attmissingval and TOAST, and render values in the server's text format: domains through their base type, enums through pg_enum, interval in EncodeInterval's postgres style, and float8 with a port of d2s.c's d2d() built without STRICTLY_SHORTEST."""
verification_explanation = """Each of the five sealed datasets was produced by tests/generator/make_dataset.py with PostgreSQL 16.15. The script works as follows:
- It builds a cluster with 1 MB segments and WAL archiving. In most seeds (four of the five sealed ones) it moves the transaction counter with pg_resetwal so that xids wrap past 2^32 during the run.
- It loads the schema: orders, order_items (with 700 to 1,100 items of closed orders that nothing touches again) and a two-level partitioned shipments table, a separately built legacy table with its own column order and a dropped column, a table in the archive schema built like shipments, an enum, a domain, and interval and float8 columns. It then rewrites orders, pg_class, pg_attribute, pg_type and pg_enum with VACUUM FULL.
- It takes a pg_basebackup while sessions keep writing; this backup is used only for the restores and is not shipped.
- It closes every open and prepared transaction, switches to a new WAL segment and takes a checkpoint. The archive the tool gets starts with that segment.
- It then runs a seeded workload of three to five interleaved sessions:
  - inserts, upserts and COPY;
  - HOT and non-HOT updates (toasted and not), updates that move rows between partitions, and deletes;
  - FOR UPDATE and FOR KEY SHARE locks that become multixacts;
  - savepoints rolled back and released, and PREPARE TRANSACTION with later COMMIT or ROLLBACK PREPARED;
  - checkpoints, VACUUM and VACUUM FREEZE, and wal_compression cycling through pglz, lz4 and off.
- Its schema changes are applied in a fixed order and redone after each restore:
  - column additions and drops, including a column of the enum type with a default;
  - VACUUM FULL orders, first;
  - ALTER COLUMN TYPE on order_items, late enough that only timeline 3 runs it;
  - attaching the legacy table, then the archive-schema table;
  - an enum value renamed, and later one added;
  - a partition created and another detached;
  - a column dropped from the partitioned table and re-added with a default, and another column with a default added to it.
- On timeline 1 it captures two restore points and runs a bad bulk job. It then restores the first backup to the first restore point, which makes timeline 2, and runs more of the same with another bad job. Then it restores again, to the second restore point on timeline 1, which makes timeline 3, and runs the last phase. Each promoted server takes a checkpoint before any work. The abandoned WAL stays in the archive.
- It ends with shared locks, a bad job, the VACUUM that removes the old versions, one transaction left open and one prepared. It then takes the base backup that is shipped and archives the remaining WAL.

Throughout, the script captured the live result of SELECT * of the three tables, with every value cast to text and TimeZone set to UTC, at about twenty-five instants chosen when no transaction was committing. These cover all three timelines and every phase. Those results are the expected answers, stored per query as the column list, a row count and the sorted row hashes.

The test copies each dataset and the collected rewind.py into a scratch directory. It runs the tool as `python3 -I rewind.py DATA_DIR`, in one fresh process per dataset, as an unprivileged user with no new privileges and bounded CPU, memory, files and processes. It sends all of that dataset's queries on stdin and parses the JSON lines printed on stdout. The test process never imports candidate code. Columns must match exactly, and the rows must equal the live server's rows as a multiset. A further test checks that the sandboxed process can neither read the expected answers nor write the reward.

Measured with 2 CPUs: the reference scores 1 and answers a dataset's 78 to 81 queries in 7 to 11 seconds. The skeleton scores 0. Each of these single mistakes injected into the reference fails at least one sealed dataset, and so scores 0:
- using the backup's pages as the starting state;
- leaving out the rewritten tables' lost pages;
- matching ALTER TABLE's copies by xmin, as for VACUUM FULL;
- printing numeric at each value's stored scale rather than the column's;
- taking the first page image without undoing its change;
- finding first images on timeline 1's path instead of the final timeline's;
- trusting the backup's pg_xact for every transaction;
- following only the relations present in the backup (4 of 5);
- mapping a partition's columns by position;
- keeping partitions that were detached;
- only following partitions in the parent's schema;
- reading enum labels from any version of pg_enum rather than the one visible at the instant;
- treating timeline 3 as a child of timeline 2;
- printing float8 with Python's shortest repr;
- leaving out the "+" that follows a negative interval field;
- not resolving the domain to its base type;
- returning NULL for a partition's fast-default column;
- replaying to the end and filtering by commit time."""
category = "Software"
subcategory = "Databases"
tags = ["postgresql", "wal", "point-in-time-recovery", "forensics", "mvcc", "storage-format", "python"]
expert_time_estimate_hours = 10
relevant_experience = "I work on backend services in Python and JavaScript that run on PostgreSQL, and I have dealt with the recovery side of it: restoring rows after bad migrations, point-in-time restores, and reading PostgreSQL internals (WAL records, heap pages, TOAST, transaction status) to understand what happened. I wrote the workload generator that produced these datasets from a real server and the reference tool, and I checked the tool against live query results captured during each run."

