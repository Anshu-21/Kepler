[task]
name = "afterquery/contract-settlement-reconstruction"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = "The contracts are synthetic, but they are shaped like what a loan-operations or project-finance desk settles: up to twenty tranches over up to fifty years of monthly periods, each with its own day count, fixed or SOFR-plus-spread terms, seniority, lockout and withholding tax; a reserve account; separate payment and SOFR calendars; published fixings with later corrections; a booking log of rate changes that are revised, retracted and backdated, stamped by offices in different time zones, including standing rate bookings that the pricing desk re-confirms at almost every determination date; prepayments; and the cash and collateral reported for each payment date. Nothing is hidden and nothing has to be guessed. A settlement is only right when every rule is right at once, on every tranche of every period, to the cent, and the rules feed each other across periods.\n\nThere are three layers of difficulty. The first is the accrual rules: schedules with month-end fallback and Modified Following, knowledge cut at 17:00 New York time on each determination date (a timestamp has to be read as an instant, with New York's daylight-saving switch), segments that break only on a tranche's own events, SOFR compounded in arrears per segment on its own calendar with lookback and a lockout anchored to the period end, and seven day counts including ACT/ACT ISDA, 30E/360 ISDA with its February exception and ACT/ACT ICMA on unadjusted regular periods. The second is the cash layer, where every period depends on the history before it: true-ups from restating earlier periods on their historical balances, negative interest carried as credit, deferred interest with overdue interest on the tranche's own day count, a default margin that restatement must take from history, arrears, coverage cures rounded up and paid senior-first, withholding gross-ups defined as the smallest cent that covers the net after rounded tax, a reserve whose top-up target is sized on the sweep the top-up itself changes, two waterfall orders, pari passu sharing with leftover cents to the largest amounts, and sweep or release.\n\nThe third layer is where solvers fail, and it is the essential difficulty: restating thirty to fifty years of history at every payment date within 6 seconds. A rate change persists until superseded, so a standing booking that is re-confirmed with a new grid value at each determination date changes the restated interest of every earlier period, every time. The natural engine, which every capable attempt we have seen writes, keeps a cache of period accruals and invalidates the periods a changed booking can reach; on the sealed contracts at the bounds (540 to 600 periods, 18 to 20 tranches, up to about 11,000 bookings with single logical bookings revised over 400 times) that is a quadratic number of cache visits and takes 7 to 33 seconds. The same engines settle random contracts at the bounds in well under a second, so stress-testing with random bookings does not reveal the problem; only reasoning about the worst case allowed by the stated bounds does. A passing engine has to change the shape of the computation: an accrual of a period with no rate change inside it depends only on the level in force, so per tranche and level it keeps lazily filled accruals in a Fenwick tree, restates a tranche as one range query per stretch between known rate changes plus the few periods that contain one, and refreshes only the floating periods a corrected fixing can reach. That settles the largest sealed contract in under 2 seconds without ever changing a result.\n\nThe only worked example is short and fully funded, so it cannot confirm most of the rules. An expert who has built loan-servicing or waterfall engines would need one to two working days to implement, optimise and check this."
solution_explanation = "Keep the layers apart. The calendar layer builds the schedule: regular boundaries from the opening date, accrual ends, Modified Following payment dates and determination dates counted back in payment business days. The knowledge layer parses every timestamp to a UTC instant and, for each determination date, admits the records at or before 17:00 New York time (UTC-4 from the second Sunday of March to the first Sunday of November, else UTC-5), keeps the highest revision of each logical id, drops retractions, overlays fixing corrections on the published fixings and groups live rate changes by tranche. The accrual layer accrues one tranche over one period from a starting level, the known changes inside the period, the recorded opening balance and the recorded default flag; segments break at the tranche's own prepayments and changes and each is rounded half up once, with floating segments using SOFR compounded for exactly that segment (runs on the period's last lockout_days rate business days take the fixing of the day before them), rounded to seven places, floored, plus spread, plus the default margin when flagged.\n\nRestatement is the part that decides the runtime. Every rate change falls strictly inside one period, so a tranche's known changes split its earlier periods into stretches at one constant level and a few periods that contain a change. The accrual of a period without a change depends only on that level, its history and the fixings, so for each tranche and level keep a Fenwick tree of those accruals, filled lazily with a skip pointer over filled entries. The restated total is then one range query per stretch plus memoised accruals of the change periods, keyed on the level, the changes inside and the period's fixing version. A corrected fixing bumps the version of every floating period that can look it up (end after the date, start no more than 40 days after it) and refreshes those entries at every level already filled. A standing booking revised hundreds of times therefore costs one range query per revision instead of a pass over every earlier period. The true-up is the restated total minus what was recognised.\n\nSettlement walks the periods. Gross interest due is the smallest whole-cent gross that covers the net: start at ceil(net / (1 - rate)) and step a cent up or down until it is the smallest gross whose credit after the rounded tax covers net. Current interest adds the carried credit and floors at zero. Interest due adds the previous deferred amount and its overdue interest, which uses the tranche's own day count between the two payment dates. Principal due adds arrears and is capped at the post-prepayment balance, with everything due at maturity. Collections pay the fee, then by level interest, then the coverage cure (rounded up, paid senior-first, pari passu by outstanding, counted as principal), then principal still due, in the configured order. Within a level, cash is shared in integer cents, with leftover cents going one each to the largest amounts, ties by tranche id. Before a covered level's interest, any shortfall is drawn from the reserve. After principal, the top-up is the smallest cent amount satisfying the reserve target, where the target depends on the sweep the remaining cash would make; the condition is monotone in the top-up, so a binary search over cents finds it. Excess is then swept by level or released, and on the final date the whole reserve is drawn after the fee."
verification_explanation = "The verifier image builds eight sealed contracts from tests/model.py, a settlement model written from the specification in exact rational arithmetic. It shares no code with the reference engine. It restates by recomputing every earlier period at every payment date under a memo keyed on every input an accrual reads, so it is slow but plainly correct. Collections and collateral are generated by running the model, so periods are underfunded, exactly funded and overfunded, and coverage tests both pass and fail. Three contracts sit at the bounds (540 to 600 periods, 18 to 20 tranches, about 8,000 to 11,000 bookings, 100 to 120 prepayments, and on most tranches a standing rate booking revised at almost every determination date from a small grid of values, so single logical bookings carry 490 to 590 revisions); five smaller ones target specific rules. Between them they use all seven day counts, fixed and floating tranches with binding floors, lockouts of one to three days, both accrual-date rules, both waterfall orders, both excess-cash rules, shared and single seniority levels, notice periods of one to five days, varied anchors with February and leap-year boundaries, a 30E/360 ISDA termination at the end of February, a month-end prepayment, a prepayment larger than the balance, fixing corrections, grossed-up tranches, reserve draws and top-ups, and rate bookings recorded in advance, within an hour either side of the 17:00 New York cutoff (in UTC and eight other offsets, across both daylight-saving regimes, some exactly at it), on the payment date and late, with revisions and retractions.\n\ntests/build_check.py fails the image build unless the contracts regenerate to a recorded SHA-256 digest, every contract respects the stated bounds, no accrual, SOFR or overdue rounding lies within 1e-7 of a half unit, one logical booking has at least 400 revisions, and the contracts reach at least 100 gross-ups off ceil(net / (1 - rate)), 20 off its rounding, 5 top-ups against a sweep, 50 bookings whose knowledge flips under a local-date or fixed-offset reading of the cutoff, 5 exactly at it, and 20 ICMA accrual periods that straddle a regular boundary. It saves the sealed pairs inside the root-only /tests directory so the test does not regenerate them.\n\nThe single test runs each contract twice in separate unprivileged subprocesses with the 6 second limit stated in the specification. It requires the two runs to agree, rejects a symlinked artifact, and checks that the input and the engine are unchanged. It compares every period's dates, collections, fee paid and released cash, reserve draw, top-up and balance, and every tranche's twelve amounts and default flag, as exact values. The verifier never imports candidate code and only exchanges JSON.\n\nMeasured on our machine: the reference scores 1 and settles each of the largest contracts in 1.5 to 1.9 seconds; three independently written engines that are correct to the cent on every sealed contract but restate by invalidating cached period accruals take 7 to 33 seconds on them, so they fail; the untouched legacy engine scores 0. The reference agrees with the model on 160 randomly generated contracts across the bounded space, and single-rule mutations of the reference (knowledge timing, cutoff offsets, revision choice, true-ups, credits, overdue basis, arrears, default margin history, cures, waterfall order, pari passu cents, sweeps, fixing corrections, gross-up shortcuts, reserve sizing, lockout anchoring, ICMA periods, day counts, rounding and cache invalidation) each fail at least one sealed contract."
category = "Operations"
subcategory = "Finance"
tags = ["finance", "loan-servicing", "settlement", "waterfall", "sofr", "incremental-computation"]
expert_time_estimate_hours = 14
relevant_experience = "I build backend and data services in Python and JavaScript, including ledger-shaped systems where the same business event is restated across revisions and payments have to be reproduced exactly as they were made. The parts of that work this task is made of are the ones I have had to get exactly right: day-count conventions and business-day calendars, compounded overnight rates, decimal rounding that has to agree to the cent, priority-of-payments waterfalls with deferrals and leftover-cent rules, and catch-up adjustments for corrections booked after settlement. I also wrote the independent model the verifier uses."

