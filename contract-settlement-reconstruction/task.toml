[task]
name = "afterquery/contract-settlement-reconstruction"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = "The contracts are synthetic, but they are shaped like what a loan-operations or structured-finance desk settles: up to ten tranches over up to thirty years of monthly periods, each with its own day count, fixed or SOFR-plus-spread terms, seniority and withholding tax; a reserve account; separate payment and SOFR calendars; published fixings with later corrections; a booking log of rate changes that are revised, retracted and backdated; prepayments; and the cash and collateral reported for each payment date. Nothing is hidden and nothing has to be guessed. A settlement is only right when every rule is right at once, on every tranche of every period, to the cent, and the rules feed each other across periods.\n\nThere are three layers of difficulty. The first is the accrual rules: schedules with month-end fallback and Modified Following, knowledge cut at each determination date, segments that break only on a tranche's own events, SOFR compounded in arrears per segment on its own calendar with lookback, rounding, floor and spread, and six day counts including ACT/ACT ISDA and 30E/360 ISDA with its February exception. The second is the cash layer, where every period depends on the history before it: true-ups from restating earlier periods on their historical balances, negative interest carried as credit, deferred interest that accrues compounding overdue interest, a default margin that a shortfall switches on for the next period's accrual (and that restatement must take from history, not from the current state), principal and fee arrears, coverage tests whose cures are rounded up and paid senior-first out of cash meant for junior interest, interest grossed up for withholding, reserve draws for covered levels and top-ups, two waterfall orders, pari passu sharing with largest-remainder cents, and sweep or release. One wrong cent moves cash, which moves balances, default status and every later period. Two of these rules are defined as the smallest whole-cent amount that satisfies a condition, the way gross-up and reserve clauses are drafted. The obvious formulas are close but wrong. A gross-up can sit a cent either side of net / (1 - rate), because the tax is rounded on the gross. The reserve top-up is circular, because its target is sized on the balance left after the sweep, and the sweep is the cash the top-up does not take. The sealed contracts contain 1,234 gross-ups that differ from the ceiling of that formula and 321 that differ from its rounding, plus 26 top-ups made against a live sweep. The third is scale: the largest sealed contracts have 360 periods, ten tranches and over 600 bookings, against a stated 6 second budget per contract. Re-accruing every earlier period at every payment date is far too slow there, and so is the natural shortcut of memoising each accrual on a signature of the bookings it reads (7 to 10 seconds on the three largest contracts), because building those signatures is itself quadratic. A passing engine has to restate incrementally, invalidating exactly the accruals a changed booking can reach (a rate change persists until superseded; a corrected fixing reaches back through lookbacks and runs that start before a segment), without ever changing a result.\n\nThe only worked example is short and fully funded, so it cannot confirm most of these rules. 54 of 54 single-rule mistakes we tried, including stale or too-narrow cache invalidation, fail at least one of the eight sealed contracts.\n\nAn expert who has built loan-servicing or waterfall engines would need one to two working days to implement, optimise and check this."
solution_explanation = "Keep the layers apart. The calendar layer builds the schedule: regular boundaries from the opening date, accrual ends, Modified Following payment dates and determination dates counted back in payment business days. The knowledge layer takes, for each determination date, the highest-revision booking of each logical id recorded on or before it, drops retractions, overlays fixing corrections on the published fixings and groups rate changes by tranche. The accrual layer accrues one tranche over one period from its recorded opening balance and recorded default flag: rate changes effective before the period set the starting rate, segments break at the tranche's own prepayments and rate changes, and each segment is rounded half up once, with floating segments using SOFR compounded for exactly that segment, rounded to seven places, floored, plus spread, plus the default margin when flagged.\n\nRestatement is incremental. Keep a per-tranche cache of period accruals. At each determination date, diff the winning bookings against the previous date. A changed rate change clears that tranche's cache from the period containing its effective date onward. A changed fixing clears every floating period whose segments could look it up, meaning any period ending after the date and starting no more than a safe reach (40 days) after it. Recompute only cleared entries. The true-up is the cached restated sum for earlier periods minus what was recognised. Keep a running restated total per tranche so the true-up costs nothing to read. This settles a 360-period, ten-tranche contract in about a second.\n\nSettlement walks the periods. Gross interest due is found from the definition: start at ceil(net / (1 - rate)) and step a cent up or down until it is the smallest gross whose credit after the rounded tax covers net. Current interest adds the carried credit and floors at zero. Interest due adds the previous deferred amount and its overdue interest over the payment-date gap. Principal due adds arrears and is capped at the post-prepayment balance, with everything due at maturity. Collections pay the fee, then by level interest, then the coverage cure (rounded up, paid senior-first, pari passu by outstanding, counted as principal), then principal still due, in the configured order. Within a level, cash is shared in integer cents with largest-remainder leftovers. Before a covered level's interest, any shortfall is drawn from the reserve. After principal, the top-up is the smallest cent amount satisfying the reserve target, where the target depends on the sweep the remaining cash would make; the condition is monotone in the top-up, so a binary search over cents finds it. Excess is then swept by level or released, and on the final date the whole reserve is drawn after the fee. Deferred interest, arrears, fee arrears, default flags and balances carry forward."
verification_explanation = "The verifier image builds eight sealed contracts from tests/model.py, a settlement model written from the specification in exact rational arithmetic. It shares no code with the reference engine. It restates by recomputing every earlier period under a memo keyed on every input an accrual reads, not by cache invalidation. Collections and collateral are generated by running the model, so periods are underfunded, exactly funded and overfunded, and coverage tests both pass and fail. Three contracts sit at the bounds (300 to 360 periods, nine or ten tranches, 570 to 640 bookings and 65 to 75 prepayments); five smaller ones target specific rules. Between them they use all six day counts, fixed and floating tranches with binding floors, both accrual-date rules, both waterfall orders, both excess-cash rules, shared and single seniority levels, notice periods of one to five days, varied anchors with February and leap-year boundaries, a 30E/360 ISDA termination at the end of February, a month-end prepayment, a prepayment larger than the balance, fixing corrections, and rate bookings recorded in advance, on the determination date, on the payment date and late, with revisions and retractions. Seven of the eight have grossed-up tranches and seven have a reserve account with draws and top-ups. They produce positive and negative true-ups, credits, deferred and overdue interest, default-margin periods, coverage cures, arrears, fee shortfalls, pari passu shortfalls, sweeps and releases.\n\ntests/build_check.py fails the image build unless the contracts regenerate to a recorded SHA-256 digest, every contract respects the stated bounds, no accrual, SOFR or overdue rounding lies within 1e-6 of a half unit, and the contracts contain at least 100 gross-ups off ceil(net / (1 - rate)), 20 off its rounding and 5 top-ups against a sweep. The rounding check is what makes Decimal and exact arithmetic agree to the cent, as the specification promises; withholding and reserve targets are exact decimal products, so their halves are unambiguous.\n\nThe single test runs each contract twice in separate unprivileged subprocesses with the 6 second limit stated in the specification. It requires the two runs to agree, rejects a symlinked artifact, and checks that the input and the engine are unchanged. It compares every period's dates, collections, fee paid and released cash, reserve draw, top-up and balance, and every tranche's twelve amounts and default flag, as exact values. The verifier never imports candidate code and only exchanges JSON.\n\nMeasured: the reference scores 1 and settles each of the largest contracts in 0.9 to 1.2 seconds; the same engine with a signature memo instead of invalidation takes 7 to 10 seconds, so it fails; the untouched legacy engine scores 0. The reference agrees with the model on 300 randomly generated contracts across the bounded space. All 54 single-rule mutations of the reference fail at least one sealed contract; the mutations cover knowledge timing, revision choice, true-ups, credits, overdue compounding, arrears, default margin placement and history, every coverage-cure detail, waterfall order, pari passu cents, sweeps, fixing corrections, gross-up shortcuts (ceiling, rounding, adjusting only upward), reserve draws, maturity release, target floor and target sizing before or after a full sweep, every SOFR and day-count detail, final bullet, prepayment cap, rounding, and three kinds of wrong cache invalidation."
category = "Operations"
subcategory = "Finance"
tags = ["finance", "loan-servicing", "settlement", "waterfall", "sofr", "incremental-computation"]
expert_time_estimate_hours = 12
relevant_experience = "I build backend and data services in Python and JavaScript, including ledger-shaped systems where the same business event is restated across revisions and payments have to be reproduced exactly as they were made. The parts of that work this task is made of are the ones I have had to get exactly right: day-count conventions and business-day calendars, compounded overnight rates, decimal rounding that has to agree to the cent, priority-of-payments waterfalls with deferrals and leftover-cent rules, and catch-up adjustments for corrections booked after settlement. I also wrote the independent model the verifier uses."

