[task]
name = "afterquery/rtree-repair"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = """This is the work of a graphics or editor-tooling engineer who owns the hit-testing and selection layer of a canvas application (diagram tools, whiteboards, CAD viewers) and is handed a spatial index that has started returning wrong shapes after long editing sessions. The index is a dynamic R-tree that also carries a z-order aggregate: every node stores the top shape (highest z, smallest id) below it, which is what keeps hover picking cheap when hundreds of large shapes are stacked over the same point.

For a human, the difficulty is that the defects are interacting and data dependent, and none of them shows on small random scenes. A split that drops a child only when the halves overlap, a condense step that reinserts whole subtrees as if they were shapes, ancestor bounds that are never shrunk, an id table that keeps pointing at the replaced entry after update(), and a z aggregate that is only maintained on insert all look fine until clusters, nested shapes, long-distance moves or draining the tree expose them. Fixing the symptom that a test shows leaves the next one in place; the engineer has to reason about the invariants of the whole insert/split/remove/condense/reinsert/update path, including the less familiar one (node.top must stay exact through splits, root collapse, z-only updates and removal of the current top).

For an agent, patching is not enough because the checks are exact and deep: every node's bounds must equal the minimum bounding rectangle, every node's top must be exact, fill and depth rules must hold after thousands of mixed operations on grid, cluster, diagonal and nested scenes, and then two inspection budgets must hold on 38,000 to 50,000 shape scenes after tens of thousands of moves and deletions, one of which can only be met by pruning hitTest with the top aggregate in best-first order. A textbook R-tree adapted to the contract still fails: it has no top aggregate, its hit test visits roughly 1,000 nodes and entries on the stacked scene, and equal-z tie-breaking by id has to be right inside the pruning."""
solution_explanation = """Make recalc() the single place where a node's aggregates are rebuilt from its children, and call it for every node on the path after any structural change: bounds become the exact MBR and top becomes the best child top (highest z, then smallest id). Insert descends by least enlargement then smallest area, adds the entry, then walks the path back up recomputing and splitting overfull nodes; the split tries four axis/edge sorts at every legal cut and keeps the minimum overlap then minimum total area, growing a new root when the root splits. Remove finds the entry through the id table and bounds containment, removes it, walks up removing underfull non-root nodes from their parent and collecting every entry beneath them, recomputes every ancestor, collapses a root with one child and reinserts the orphans as entries. Update validates, removes, inserts a fresh entry and updates the id table. hitTest descends only into children that contain the point, visits them in order of their top, and stops as soon as a child's top cannot beat the best shape found so far. Predicates are half-open and ids are compared by code unit. The reference passes all twelve scenarios in about 15 seconds; its worst localized queryRect costs about 90 inspections (budget 400) and its worst hitTest on the stacked scene about 250 (budget 500)."""
verification_explanation = """The verifier runs in three separate steps so that nothing the candidate does can influence the verdict. tests/harness.js, which never loads candidate code, generates a deterministic trace of operations for a scenario from seeded generators. A second process, tests/runner.js, started as an unprivileged user with no new privileges, loads the candidate rtree.js, replays the trace and writes raw observations (query results, return values, whether calls threw, inspection counters, and a serialized dump of tree.root) to a file. The harness then replays the trace against a brute-force model and judges the observations itself; the candidate cannot print or forge a verdict, and exiting early or crashing simply leaves observations missing, which fails.

What is judged: every queryRect result (exact list and order) and hitTest result against a full scan, with probes sitting exactly on shape edges; the return values and throw behaviour of insert, remove and update; and, on the dump, the exact minimum bounding rectangle of every node, the exact top shape of every node, capacity and minimum fill, internal-root arity, uniform leaf depth, null bounds and top on an empty root, every id exactly once with its current bounds and z, and size. Scenarios cover contract details (half-open edges, code-unit id order, default z, errors leaving the index unchanged, returned copies, empty tree), the operation sequences from the brief plus a rebuild from scratch, four adversarial distributions with churn and spatial-order deletion, repeated long-distance moves, drain and refill, z-order churn with many ties, a tamper probe (an entry removed from its leaf must stop appearing in queryRect, so answers must come from the tree), a 50,000-shape scene with 40,000 structural operations and a 38,000-shape stacked-layer scene with 18,000. Localized queryRect must stay within 400 inspections and hitTest within 500, measured both from the counters the tree reports and from a descent the judge recomputes on the dumped tree, so neither a side array nor fake counters passes. No timing is used. Checked: the reference passes all twelve tests, the shipped starter fails eleven, and variants with stale ancestor bounds, a bad subtree choice, a hitTest that ignores top, a whole-scene scan or an early exit printing a pass all fail."""
category = "Software"
subcategory = "Algorithms"
tags = ["r-tree", "spatial-index", "data-structures", "debugging", "javascript"]
expert_time_estimate_hours = 6
relevant_experience = "I build browser and Node.js tooling in JavaScript, including canvas-based editors, and I have debugged hierarchical data structures with cached aggregate state (bounding boxes, subtree sizes) where updates failed to propagate. I wrote the reference tree, the seeded adversarial scene generators and the structural checker for this task."

