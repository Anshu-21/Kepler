[task]
name = "afterquery/rtree-repair"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = """This is the work of a graphics or editor-tooling engineer who owns the hit-testing, selection, bulk-edit and undo layer of a canvas application (diagram tools, whiteboards, CAD viewers). They inherit a plain mutable R-tree of about 250 lines that returns wrong shapes after long editing sessions, and must turn it into a persistent, versioned spatial index. All scenes used by the checks are synthetic, produced from seeded random generators.

The starter has no persistence machinery, no z-order aggregate and none of the newer operations, only a mutable tree with several interacting, data-dependent defects that never show on small random scenes: a split that drops a child only when the two halves overlap, a condense step that reinserts whole subtrees as if they were shapes, ancestor bounds that are never shrunk, a root that is never collapsed, an id table that still points at the replaced entry after update(), a subtree choice that produces badly overlapping nodes, and a few predicate and ordering mistakes.

Seven pieces of design work remain, each of which a specialist knows but whose combination is slow and easy to get subtly wrong. (1) Index quality: a textbook Guttman quadratic split passes every correctness check but costs thousands of inspections per localized query on clustered scenes, so the split and subtree-choice heuristics have to be genuinely good and are judged by inspection counts recomputed on the agent's own tree. (2) A per-node top shape (highest z, then smallest id) that stays exact through splits, condensation, root changes and z-only updates, used to prune hit testing and to drive a best-first queryTop. (3) Persistence: O(1) snapshot, restore for undo, and structural sharing so one edit creates a bounded number of new nodes and never writes into a node an older version can still see. (4) Numerics: coordinates anywhere in the finite double range, so widths and areas overflow. (5) removeRect: bulk deletion with closed containment (a zero-area shape on the far edge goes too) that drops whole subtrees, dissolves underfull nodes and reinserts survivors while keeping uniform depth, fill, bounds and top exact, copy-on-write, sharing every untouched subtree with the previous version. (6) nearest: best-first k-nearest with exact tie handling, nodes expanded before entries at equal distance. (7) diff between two arbitrary versions, including versions on different branches of an undo history, across the branch point of an undo history; walking the two trees cannot be aligned once nodes have split and been copied, so the natural solution tracks the history of edits and combines it across the branch point.

The checks are exact: minimum bounding rectangles and top on every node of the live tree and of every retained version, fill, depth and arity rules after thousands of mixed operations on grid, cluster, diagonal, nested, stacked, sorted and extreme-magnitude scenes, and fixed work budgets on 38,000 to 50,000 shape scenes after tens of thousands of moves and deletions."""
solution_explanation = """Make recalc() the single place where a node's aggregates are rebuilt from its children (bounds = exact MBR, top = best child top by highest z then smallest id). Make the tree persistent with epoch-based copy-on-write: every node records the epoch that created it; snapshot() and restore() bump the epoch; a mutation walks its path top-down through _own(), which returns the node unchanged if it belongs to the current epoch and otherwise copies it and relinks the copy under its already-copied parent. Split siblings, new roots and replacement roots are tagged with the current epoch. Entries are immutable (update builds a new one). Insert descends by least enlargement, then least margin enlargement, then smallest area, recomputes and splits overfull nodes bottom-up with an overlap-minimising sort-based split over both axes; all area arithmetic falls back to coordinates scaled by 2^-600 when a raw product overflows. Remove finds the entry through the id table and bounds containment, removes underfull non-root nodes while collecting the entries beneath them, recomputes ancestors, collapses a root with one child and reinserts the orphans. removeRect recurses with closed-box pruning, drops a node wholesale when the rectangle contains its bounds, rebuilds touched nodes as copies, dissolves non-root nodes left below the minimum into an orphan list, collapses the root and reinserts the orphans. hitTest and a heap-based queryTop use node.top as an upper bound; nearest is a heap-based best-first search that expands nodes before entries at equal distance. Versions form a tree of edit-log records (each edit appends the old and new shape of every id it changed to a child of the current version; snapshot keeps the current record and restore moves back to it), and diff(a, b) climbs both versions to their common ancestor, combines the changes on each side (earliest before, latest after) and reports ids whose resulting shapes differ, so it never reads a tree node. The reference passes all twenty-one scenarios in about 50 seconds; its worst localized queryRect costs about 170 inspections (budget 400), hitTest about 250 (500), queryTop about 250 (600), nearest about 100 inspections (250), removeRect about one new node per removed shape (limit 3n+80), and one edit creates at most 18 new nodes (limit 40)."""
verification_explanation = """The verifier runs in three separate steps so that nothing the candidate does can influence the verdict. tests/harness.js, which never loads candidate code, generates a deterministic trace of operations for a scenario from seeded generators. A second process, tests/runner.js, started as an unprivileged user with no new privileges, loads the candidate rtree.js, replays the trace and writes raw observations (query results, return values, whether calls threw, inspection counters, and serialized dumps of tree.root and of snapshot roots including per-node object identities) to a file. The harness then replays the trace against a brute-force model (which also keeps a copy of the scene at every snapshot) and judges the observations itself; the candidate cannot print or forge a verdict, and exiting early or crashing leaves observations missing, which fails.

What is judged: every queryRect result (exact list and order) and hitTest result against a full scan, with probes on shape edges, for the live tree and for retained snapshots; the return values and throw behaviour of insert, remove and update; and, on the dumps, the exact minimum bounding rectangle and exact top of every node, capacity and minimum fill, internal-root arity, uniform leaf depth, null bounds and top on an empty root, every id exactly once with its current bounds and z, and size. Persistence is checked by taking a snapshot and dumping it after every single operation of a 3,000-shape scene and requiring each snapshot to still equal the scene as it was after later mutations (so writing into a shared node is caught), by requiring that consecutive versions share all but at most 40 node objects (deep-cloning in snapshot() is caught), and by an undo scenario that restores old versions, edits from them and re-verifies all 25 retained versions. Other scenarios cover contract details, the operation sequences from the brief plus a rebuild, four adversarial distributions with churn and spatial-order deletion, repeated long-distance moves, drain and refill, z-order churn with many ties, a tamper probe (answers must come from the tree), a 50,000-shape scene with 40,000 structural operations, a 50,000-shape scene inserted in sweep order and moved in bulk, a 38,000-shape stacked-layer scene with 18,000 operations, queryTop against a brute-force model with churn and ties, and a scene whose coordinates span 1e-300 to Number.MAX_VALUE, including -0 and Number.MIN_VALUE, bulk removal with edge-lying zero-area shapes, nearest against a brute-force model with ties, branching version histories diffed in every direction, and a 50,000-shape scene on which nearest, removeRect and diff are held to budgets recomputed by the judge on the dumped tree (nearest) or measured as new node objects against the previous version (removeRect). Localized queryRect must stay within 400 inspections, hitTest within 500, queryTop within 600, nearest within 250 inspections and removeRect within 3n+80 new nodes, measured from the counters the tree reports and from a descent recomputed on the dumped tree. No timing is used. Checked: the reference passes all twenty-one tests, the shipped starter (a mutable tree with no top, no queryTop and no snapshots) fails all of them, and variants with stale ancestor bounds, a bad subtree choice, a hitTest that ignores top, a whole-scene scan, an early exit printing a pass, no copy-on-write, deep-clone snapshots, a restore that skips the id table, a textbook Guttman quadratic split a queryTop that sorts a full queryRect, and a nearest answered from a side copy of the scene all fail."""
category = "Software"
subcategory = "Algorithms"
tags = ["r-tree", "spatial-index", "data-structures", "debugging", "javascript"]
expert_time_estimate_hours = 14
relevant_experience = "I build browser and Node.js tooling in JavaScript, including canvas-based editors, and I have debugged hierarchical data structures with cached aggregate state (bounding boxes, subtree sizes) where updates failed to propagate. I wrote the reference tree, the seeded adversarial scene generators and the structural checker for this task."

