[task]
name = "afterquery/rtree-repair"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = """This is the work of a graphics or editor-tooling engineer who owns the hit-testing, selection and undo layer of a canvas application (diagram tools, whiteboards, CAD viewers). They inherit a plain mutable R-tree of about 250 lines that returns wrong shapes after long editing sessions, and must turn it into a persistent index with a z-order aggregate and a top-k query. All scenes used by the checks are synthetic, produced from seeded random generators.

The starter has no persistence machinery, no z-order aggregate and no queryTop, only a mutable tree with several interacting, data-dependent defects that never show on small random scenes: a split that drops a child only when the two halves overlap, a condense step that reinserts whole subtrees as if they were shapes, ancestor bounds that are never shrunk, a root that is never collapsed, an id table that still points at the replaced entry after update(), a subtree choice that produces badly overlapping nodes, and a few predicate and ordering mistakes.

Four independent pieces of design work remain, each of which a specialist knows but whose combination is slow and easy to get subtly wrong. (1) Index quality: a textbook Guttman quadratic split passes every correctness check but costs thousands of inspections per localized query on clustered scenes and on shapes inserted in sweep order, so the split and subtree-choice heuristics have to be genuinely good (overlap-minimising, sort-based) and are judged only by inspection counts recomputed on the agent's own tree. (2) A per-node top shape (highest z, then smallest id) that stays exact through splits, condensation, root changes and z-only updates, used to prune hit testing where hundreds of large shapes cover a point, and a best-first queryTop(rect, k) over it; the obvious queryRect-then-sort costs about twice the budget. (3) Persistence: snapshot() in constant time, restore() for undo, and structural sharing so that one insert, remove or update creates only a bounded number of new nodes and never writes into a node an older version can still see; a single missed write site corrupts an old version only later, when it is queried. (4) Numerics: coordinates may be anywhere in the finite double range, so widths, areas and enlargements overflow to Infinity or NaN and silently break the usual comparisons in subtree choice and splitting, while all answers and invariants must stay exact.

The checks are exact: minimum bounding rectangles and top on every node of the live tree and of every retained version, fill, depth and arity rules after thousands of mixed operations on grid, cluster, diagonal, nested, stacked, sorted and extreme-magnitude scenes, and inspection budgets on 38,000 to 50,000 shape scenes after tens of thousands of moves and deletions."""
solution_explanation = """Make recalc() the single place where a node's aggregates are rebuilt from its children (bounds = exact MBR, top = best child top by highest z then smallest id) and call it for every node on the path after any structural change. Make the tree persistent with epoch-based copy-on-write: every node records the epoch that created it; snapshot() and restore() bump the epoch (snapshot is then O(1): it just keeps the root); a mutation first walks its path top-down through _own(), which returns the node unchanged if it was created in the current epoch and otherwise copies it and relinks the copy under its already-copied parent (or as the new root). Split siblings, new roots and replacement empty roots are tagged with the current epoch. Entries are immutable: update builds a new entry object and updates the id table. Insert descends by least enlargement, then least margin enlargement, then smallest area, adds the entry, recomputes and splits overfull nodes bottom-up; the split tries four axis/edge sorts at every legal cut and keeps the minimum overlap, then minimum total area, then minimum margin. All area, margin and overlap arithmetic is done on coordinates scaled by 2^-600 so that nothing overflows for coordinates up to Number.MAX_VALUE; raw coordinates are only compared. Remove finds the entry through the id table and bounds containment, owns the path, removes underfull non-root nodes from their parent while collecting every entry beneath them, recomputes ancestors, collapses a root with one child and reinserts the orphans; restore swaps the root and rebuilds the id table by walking the entries. hitTest descends only into children containing the point, in order of their top, and stops when a child's top cannot beat the best shape found. queryTop is a best-first search with a binary heap: a node is keyed by its top (an upper bound for everything below it), entries by themselves, and entries are emitted as they reach the top of the heap. Predicates are half-open and ids compare by code unit. The reference passes all seventeen scenarios in about 45 seconds; its worst localized queryRect costs about 170 inspections on sorted insertion and 90 on random scenes (budget 400), its worst hitTest on the stacked scene about 250 (budget 500), its worst queryTop about 250 (budget 600), and a single operation creates at most 18 new nodes (limit 40)."""
verification_explanation = """The verifier runs in three separate steps so that nothing the candidate does can influence the verdict. tests/harness.js, which never loads candidate code, generates a deterministic trace of operations for a scenario from seeded generators. A second process, tests/runner.js, started as an unprivileged user with no new privileges, loads the candidate rtree.js, replays the trace and writes raw observations (query results, return values, whether calls threw, inspection counters, and serialized dumps of tree.root and of snapshot roots including per-node object identities) to a file. The harness then replays the trace against a brute-force model (which also keeps a copy of the scene at every snapshot) and judges the observations itself; the candidate cannot print or forge a verdict, and exiting early or crashing leaves observations missing, which fails.

What is judged: every queryRect result (exact list and order) and hitTest result against a full scan, with probes on shape edges, for the live tree and for retained snapshots; the return values and throw behaviour of insert, remove and update; and, on the dumps, the exact minimum bounding rectangle and exact top of every node, capacity and minimum fill, internal-root arity, uniform leaf depth, null bounds and top on an empty root, every id exactly once with its current bounds and z, and size. Persistence is checked by taking a snapshot and dumping it after every single operation of a 3,000-shape scene and requiring each snapshot to still equal the scene as it was after later mutations (so writing into a shared node is caught), by requiring that consecutive versions share all but at most 40 node objects (deep-cloning in snapshot() is caught), and by an undo scenario that restores old versions, edits from them and re-verifies all 25 retained versions. Other scenarios cover contract details, the operation sequences from the brief plus a rebuild, four adversarial distributions with churn and spatial-order deletion, repeated long-distance moves, drain and refill, z-order churn with many ties, a tamper probe (answers must come from the tree), a 50,000-shape scene with 40,000 structural operations, a 50,000-shape scene inserted in sweep order and moved in bulk, a 38,000-shape stacked-layer scene with 18,000 operations, queryTop against a brute-force model with churn and ties, and a scene whose coordinates span 1e-300 to Number.MAX_VALUE, including -0 and Number.MIN_VALUE. Localized queryRect must stay within 400 inspections, hitTest within 500 and queryTop within 600, measured from the counters the tree reports and from a descent recomputed on the dumped tree. No timing is used. Checked: the reference passes all seventeen tests, the shipped starter (a mutable tree with no top, no queryTop and no snapshots) fails all but one, and variants with stale ancestor bounds, a bad subtree choice, a hitTest that ignores top, a whole-scene scan, an early exit printing a pass, no copy-on-write, deep-clone snapshots, a restore that skips the id table, a textbook Guttman quadratic split and a queryTop that sorts a full queryRect all fail."""
category = "Software"
subcategory = "Algorithms"
tags = ["r-tree", "spatial-index", "data-structures", "debugging", "javascript"]
expert_time_estimate_hours = 10
relevant_experience = "I build browser and Node.js tooling in JavaScript, including canvas-based editors, and I have debugged hierarchical data structures with cached aggregate state (bounding boxes, subtree sizes) where updates failed to propagate. I wrote the reference tree, the seeded adversarial scene generators and the structural checker for this task."

