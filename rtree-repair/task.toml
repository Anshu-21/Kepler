[task]
name = "afterquery/rtree-repair"

[metadata]
author_name = "Anshu Kumar"
author_email = "kumaranshu303393@gmail.com"
difficulty_explanation = """This is the work of a graphics or editor-tooling engineer who owns the hit-testing, selection and undo layer of a canvas application (diagram tools, whiteboards, CAD viewers) and inherits a spatial index that returns wrong shapes after long editing sessions and whose undo history is corrupted. The index is a dynamic R-tree that carries a z-order aggregate (every node stores the top shape below it, which keeps hover picking cheap when hundreds of large shapes are stacked) and has to support persistent versions: O(1) snapshots, restore for undo, and structural sharing between versions.

Two kinds of work are mixed. First, the existing code has interacting, data-dependent defects that never show on small random scenes: a split that drops a child only when the halves overlap, a condense step that reinserts whole subtrees as if they were shapes, ancestor bounds that are never shrunk, an id table that points at the replaced entry after update(), a z aggregate maintained only on insert, a restore that forgets the id table. Second, and harder, the structure must become persistent without losing any of its other invariants: every mutation path (insert descent, split, root growth, remove, condense, orphan reinsertion, root collapse, update, restore) has to copy-on-write exactly the nodes it touches, recompute bounds and top on the copies, relink them under their copied parents, and never write into a node a snapshot can still see. Missing a single write site corrupts an old version only later, when something is queried from it, which is why such bugs survive casual testing. Sharing is checked, so deep-cloning on snapshot() is rejected, and a tree that copies the full path on every step of an update will approach the limit.

The checks are exact and deep: exact minimum bounding rectangles and exact top on every node of the live tree and of every retained version, fill, depth and arity rules after thousands of mixed operations on grid, cluster, diagonal, nested and stacked scenes, and inspection budgets on 38,000 to 50,000 shape scenes after tens of thousands of moves and deletions, one of which needs hitTest to prune with the top aggregate in best-first order. A textbook R-tree adapted to the contract fails on several independent axes (no top, no persistence, no sharing), and the individual pieces are each expert-level data-structure work whose combination is easy to get subtly wrong."""
solution_explanation = """Make recalc() the single place where a node's aggregates are rebuilt from its children (bounds = exact MBR, top = best child top by highest z then smallest id) and call it for every node on the path after any structural change. Make the tree persistent with epoch-based copy-on-write: every node records the epoch that created it; snapshot() and restore() bump the epoch (snapshot is then O(1): it just keeps the root); a mutation first walks its path top-down through _own(), which returns the node unchanged if it was created in the current epoch and otherwise copies it and relinks the copy under its already-copied parent (or as the new root). Split siblings, new roots and replacement empty roots are tagged with the current epoch. Entries are immutable: update builds a new entry object and updates the id table. Insert descends by least enlargement then smallest area, adds the entry, recomputes and splits overfull nodes bottom-up (the split tries four axis/edge sorts at every legal cut, minimum overlap then minimum total area); remove finds the entry through the id table and bounds containment, owns the path, removes underfull non-root nodes from their parent while collecting every entry beneath them, recomputes ancestors, collapses a root with one child and reinserts the orphans; restore swaps the root and rebuilds the id table by walking the entries. hitTest descends only into children containing the point, in order of their top, and stops when a child's top cannot beat the best shape found. Predicates are half-open and ids compare by code unit. The reference passes all fourteen scenarios in about 30 seconds; its worst localized queryRect costs about 90 inspections (budget 400), its worst hitTest on the stacked scene about 250 (budget 500), and a single operation creates at most 18 new nodes (limit 40)."""
verification_explanation = """The verifier runs in three separate steps so that nothing the candidate does can influence the verdict. tests/harness.js, which never loads candidate code, generates a deterministic trace of operations for a scenario from seeded generators. A second process, tests/runner.js, started as an unprivileged user with no new privileges, loads the candidate rtree.js, replays the trace and writes raw observations (query results, return values, whether calls threw, inspection counters, and serialized dumps of tree.root and of snapshot roots including per-node object identities) to a file. The harness then replays the trace against a brute-force model (which also keeps a copy of the scene at every snapshot) and judges the observations itself; the candidate cannot print or forge a verdict, and exiting early or crashing leaves observations missing, which fails.

What is judged: every queryRect result (exact list and order) and hitTest result against a full scan, with probes on shape edges, for the live tree and for retained snapshots; the return values and throw behaviour of insert, remove and update; and, on the dumps, the exact minimum bounding rectangle and exact top of every node, capacity and minimum fill, internal-root arity, uniform leaf depth, null bounds and top on an empty root, every id exactly once with its current bounds and z, and size. Persistence is checked by taking a snapshot and dumping it after every single operation of a 3,000-shape scene and requiring each snapshot to still equal the scene as it was after later mutations (so writing into a shared node is caught), by requiring that consecutive versions share all but at most 40 node objects (deep-cloning in snapshot() is caught), and by an undo scenario that restores old versions, edits from them and re-verifies all 25 retained versions. Other scenarios cover contract details, the operation sequences from the brief plus a rebuild, four adversarial distributions with churn and spatial-order deletion, repeated long-distance moves, drain and refill, z-order churn with many ties, a tamper probe (answers must come from the tree), a 50,000-shape scene with 40,000 structural operations and a 38,000-shape stacked-layer scene with 18,000. Localized queryRect must stay within 400 inspections and hitTest within 500, measured from the counters the tree reports and from a descent recomputed on the dumped tree. No timing is used. Checked: the reference passes all fourteen tests, the shipped starter fails thirteen, and variants with stale ancestor bounds, a bad subtree choice, a hitTest that ignores top, a whole-scene scan, an early exit printing a pass, no copy-on-write, deep-clone snapshots and a restore that skips the id table all fail."""
category = "Software"
subcategory = "Algorithms"
